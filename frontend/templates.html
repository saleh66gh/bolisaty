<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قوالب الملصقات - بوليصتي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div id="topbar-placeholder"></div>

    <section class="page-body">
      <div class="card">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2>قوالب الملصقات</h2>
          <button class="btn" onclick="openTemplateModal()">+ قالب جديد</button>
        </div>

        <input id="templateSearch" placeholder="بحث باسم القالب" style="max-width:360px;margin-bottom:16px">

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>اسم القالب</th>
              <th>الحالة</th>
              <th>آخر تعديل</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="templatesTable"></tbody>
        </table>

      </div>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/templates.js"></script>

</body>
</html>

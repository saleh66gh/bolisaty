<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المرسلين - بوليصتي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div id="topbar-placeholder"></div>

    <section class="page-body">

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2>قائمة المرسلين</h2>
          <button class="btn" onclick="openSenderModal()">+ مرسل جديد</button>
        </div>

        <input id="senderSearch" placeholder="بحث باسم التاجر أو المتجر أو الجوال" style="max-width:360px;margin-bottom:16px">

        <table>
          <thead>
          <tr>
            <th>ID</th>
            <th>التاجر</th>
            <th>المتجر</th>
            <th>الجوال</th>
            <th>المدينة</th>
            <th>الفرع</th>
            <th>المتجر المرتبط</th>
            <th>إجراءات</th>
          </tr>
          </thead>
          <tbody id="sendersTable"></tbody>
        </table>
      </div>

    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/senders.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المستخدمون - بوليصتي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">

  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div id="topbar-placeholder"></div>

    <section class="page-body">
      <div class="card">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2>قائمة المستخدمين</h2>
          <button class="btn" onclick="openUserModal()">+ مستخدم جديد</button>
        </div>

        <input id="userSearch" placeholder="بحث بالاسم أو اسم المستخدم أو الصلاحية" style="max-width:360px;margin-bottom:16px">

        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>اسم الدخول</th>
              <th>الصلاحية</th>
              <th>المتجر</th>
              <th>الجوال</th>
              <th>الحالة</th>
              <th>آخر دخول</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>

      </div>
    </section>
  </main>

</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/users.js"></script>

</body>
</html>
